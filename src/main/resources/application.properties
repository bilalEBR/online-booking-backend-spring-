spring.application.name=online-booking-reservation

server.port=8081

# MySQL Connection for MAMP
spring.datasource.url=jdbc:mysql://localhost:3306/booking_store?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Max size for a single file
spring.servlet.multipart.max-file-size=10MB
# Max size for the entire request (files + metadata)
spring.servlet.multipart.max-request-size=10MB

